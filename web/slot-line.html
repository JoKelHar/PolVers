<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PolVers — the marketing line</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --marble:#ECE8E0; --ink:#20182A; --muted:#655E6B;
    --gold:#A9772C; --gold-deep:#7E561C; --gold-bright:#DBAE54; --plum:#281B3C;
    --display:'Space Grotesk',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--marble);color:var(--ink);font-family:var(--display);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8vh 6vw;-webkit-font-smoothing:antialiased}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6vh}
  .logo{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
  .logo b{color:var(--gold-deep)}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:28px;text-align:center}
  .line{font-weight:400;font-size:clamp(30px,6vw,60px);line-height:1.28;letter-spacing:-.02em;text-align:center;max-width:16em}
  .slot{color:var(--gold-deep);font-weight:500;display:inline-block;text-align:center;transition:opacity .26s ease, transform .26s ease}
  #slotA{min-width:4.4em} #slotB{min-width:9.2em}
  .foot{margin-top:7vh;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-align:center}
  @media (prefers-reduced-motion:reduce){ .slot{transition:none} }
</style>
</head>
<body>
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18.5" fill="#A9772C"/>
      <g transform="translate(8 7.5)" fill="#ECE8E0">
        <path d="M6.4 24 V12.4 L11 3.6 a1.7 1.7 0 0 1 3.2 .8 V9.2 h5.1 a2.2 2.2 0 0 1 2.17 2.63 l-1.3 6.6 A2.2 2.2 0 0 1 18 20.2 H6.4 Z"/>
        <rect x="1.6" y="12.4" width="4.4" height="11.6" rx="1"/>
      </g>
    </svg>
    <span class="logo">Pol<b>Vers</b></span>
  </div>

  <div class="eyebrow">The crowd decides</div>

  <div class="line" aria-label="Your idea could change the world">
    Your <span class="slot" id="slotA">idea</span> could <span class="slot" id="slotB">change the world</span>.
  </div>

  <div class="foot">idea &middot; vote &middot; comment &middot; hunch &nbsp;|&nbsp; change the world &middot; start a unicorn &middot; become your career &middot; find its people</div>

<script>
  var A=["idea","vote","comment","hunch"];
  var B=["change the world","start a unicorn","become your career","find its people"];
  var a=document.getElementById("slotA"), b=document.getElementById("slotB");
  var ia=0, ib=0, reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function swap(el,arr,idx){ el.style.opacity="0"; el.style.transform="translateY(-6px)"; setTimeout(function(){ el.textContent=arr[idx]; el.style.opacity="1"; el.style.transform="none"; },260); }
  if(!reduce){
    setInterval(function(){ ia=(ia+1)%A.length; swap(a,A,ia); }, 1900);
    setInterval(function(){ ib=(ib+1)%B.length; swap(b,B,ib); }, 1300);
  }
</script>
</body>
</html>
